apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

react {
    autolinkLibrariesWithApp()
}

def enableProguardInReleaseBuilds = false
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

def sampleAdMobAppId = 'ca-app-pub-3940256099942544~3347511713'
def sampleAdMobBannerUnitId = 'ca-app-pub-3940256099942544/9214589741'
def productionAdMobAppId = (project.findProperty('DIARYQU_ADMOB_APP_ID') ?: System.getenv('DIARYQU_ADMOB_APP_ID') ?: sampleAdMobAppId).toString()
def productionAdMobBannerUnitId = (project.findProperty('DIARYQU_ADMOB_BANNER_UNIT_ID') ?: System.getenv('DIARYQU_ADMOB_BANNER_UNIT_ID') ?: sampleAdMobBannerUnitId).toString()
def productionAdsEnabled = (project.findProperty('DIARYQU_ADS_PRODUCTION_ENABLED') ?: System.getenv('DIARYQU_ADS_PRODUCTION_ENABLED') ?: 'false').toString().toBoolean()
def productionUsingSampleIds = productionAdMobAppId == sampleAdMobAppId || productionAdMobBannerUnitId == sampleAdMobBannerUnitId

def releaseStoreFilePath = (project.findProperty('DIARYQU_RELEASE_STORE_FILE') ?: System.getenv('DIARYQU_RELEASE_STORE_FILE') ?: '').toString()
def releaseStorePassword = (project.findProperty('DIARYQU_RELEASE_STORE_PASSWORD') ?: System.getenv('DIARYQU_RELEASE_STORE_PASSWORD') ?: '').toString()
def releaseKeyAlias = (project.findProperty('DIARYQU_RELEASE_KEY_ALIAS') ?: System.getenv('DIARYQU_RELEASE_KEY_ALIAS') ?: '').toString()
def releaseKeyPassword = (project.findProperty('DIARYQU_RELEASE_KEY_PASSWORD') ?: System.getenv('DIARYQU_RELEASE_KEY_PASSWORD') ?: '').toString()
def releaseSigningConfigured = [
    releaseStoreFilePath,
    releaseStorePassword,
    releaseKeyAlias,
    releaseKeyPassword,
].every { !it.isBlank() }

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.diaryqu"
    defaultConfig {
        applicationId "com.diaryqu"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
    }
    buildFeatures {
        buildConfig true
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        if (releaseSigningConfigured) {
            release {
                storeFile file(releaseStoreFilePath)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
            manifestPlaceholders = [admobAppId: sampleAdMobAppId]
            buildConfigField "String", "ADMOB_BANNER_UNIT_ID", "\"${sampleAdMobBannerUnitId}\""
            buildConfigField "boolean", "ADS_PRODUCTION_ENABLED", "false"
            buildConfigField "boolean", "ADS_USING_SAMPLE_IDS", "true"
        }
        release {
            // Never ship with the debug keystore. Release remains unsigned until
            // DIARYQU_RELEASE_* values are supplied by the release environment.
            if (releaseSigningConfigured) {
                signingConfig signingConfigs.release
            }
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
            manifestPlaceholders = [admobAppId: productionAdMobAppId]
            buildConfigField "String", "ADMOB_BANNER_UNIT_ID", "\"${productionAdMobBannerUnitId}\""
            buildConfigField "boolean", "ADS_PRODUCTION_ENABLED", "${productionAdsEnabled}"
            buildConfigField "boolean", "ADS_USING_SAMPLE_IDS", "${productionUsingSampleIds}"
        }
    }
}

dependencies {
    implementation("com.facebook.react:react-android")
    implementation("com.google.android.gms:play-services-ads:25.4.0")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}
