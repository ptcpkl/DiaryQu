apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

react {
    autolinkLibrariesWithApp()
}

def enableProguardInReleaseBuilds = false
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

def sampleAdMobAppId = 'ca-app-pub-3940256099942544~3347511713'
def sampleAdMobBannerUnitId = 'ca-app-pub-3940256099942544/9214589741'
def productionAdMobAppId = (project.findProperty('DIARYQU_ADMOB_APP_ID') ?: System.getenv('DIARYQU_ADMOB_APP_ID') ?: sampleAdMobAppId).toString()
def productionAdMobBannerUnitId = (project.findProperty('DIARYQU_ADMOB_BANNER_UNIT_ID') ?: System.getenv('DIARYQU_ADMOB_BANNER_UNIT_ID') ?: sampleAdMobBannerUnitId).toString()
def productionAdsEnabled = (project.findProperty('DIARYQU_ADS_PRODUCTION_ENABLED') ?: System.getenv('DIARYQU_ADS_PRODUCTION_ENABLED') ?: 'false').toString().toBoolean()
def productionUsingSampleIds = productionAdMobAppId == sampleAdMobAppId || productionAdMobBannerUnitId == sampleAdMobBannerUnitId

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.diaryqu"
    defaultConfig {
        applicationId "com.diaryqu"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
    }
    buildFeatures {
        buildConfig true
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
            manifestPlaceholders = [admobAppId: sampleAdMobAppId]
            buildConfigField "String", "ADMOB_BANNER_UNIT_ID", "\"${sampleAdMobBannerUnitId}\""
            buildConfigField "boolean", "ADS_PRODUCTION_ENABLED", "false"
            buildConfigField "boolean", "ADS_USING_SAMPLE_IDS", "true"
        }
        release {
            signingConfig signingConfigs.debug
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
            manifestPlaceholders = [admobAppId: productionAdMobAppId]
            buildConfigField "String", "ADMOB_BANNER_UNIT_ID", "\"${productionAdMobBannerUnitId}\""
            buildConfigField "boolean", "ADS_PRODUCTION_ENABLED", "${productionAdsEnabled}"
            buildConfigField "boolean", "ADS_USING_SAMPLE_IDS", "${productionUsingSampleIds}"
        }
    }
}

dependencies {
    implementation("com.facebook.react:react-android")
    implementation("com.google.android.gms:play-services-ads:25.4.0")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}
